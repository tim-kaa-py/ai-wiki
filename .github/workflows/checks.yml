name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OKF conformance check
        run: python3 scripts/okf-check.py
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -v
